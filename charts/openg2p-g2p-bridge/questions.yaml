questions:
#TODO: Add questions for PBMS host, PBMS DB, Registry Host, Registry DB.

- variable: global.g2pBridgeHostname
  description: Hostname under which all Bridge services will be accessed
  type: string
  label: G2P Bridge Hostname

- variable: openg2p-g2p-bridge-api.enabled
  description: Install G2P Bridge API
  type: boolean
  label: G2P Bridge API

- variable: openg2p-g2p-bridge-celery-beat-producers.enabled
  description: Install G2P Bridge Celery Beat Producers
  type: boolean
  label: G2P Bridge Celery Beat Producers

- variable: openg2p-g2p-bridge-celery-workers.enabled
  description: Install G2P Bridge Celery Workers
  type: boolean
  label: G2P Bridge Celery Workers

- variable: global.keycloakBaseUrl
  description: Keycloak Base Url used in all components
  type: string
  label: Keycloak Base URL
  # Currently this is required only for the purpose of keymanager.
  # Change this "show_if" condition later if this is required for other purposes also.
  show_if: "keymanager.enabled=true&&global.g2pBridgeKeymanagerAuthEnabled=true"

- variable: global.g2pBridgeAuthClientId
  description: OIDC Client ID for G2P Bridge
  type: string
  label: OIDC Client ID
  # Currently this is required only for the purpose of keymanager.
  # Change this "show_if" condition later if this is required for other purposes also.
  show_if: "keymanager.enabled=true&&global.g2pBridgeKeymanagerAuthEnabled=true"

- variable: global.g2pBridgeAuthClientSecret
  description: OIDC Client Secret for G2P Bridge
  type: string
  label: OIDC Client Secret
  # Currently this is required only for the purpose of keymanager.
  # Change this "show_if" condition later if this is required for other purposes also.
  show_if: "keymanager.enabled=true&&global.g2pBridgeKeymanagerAuthEnabled=true"

- variable: global.g2pBridgeMapperBaseUrl
  description: Base URL to reach SPAR Mapper
  type: string
  label: Mapper API Base URL

- variable: global.g2pBridgeExampleBankBaseUrl
  type: string
  label: Bank APIs Base URL

- variable: global.PBMSDBHostname
  description: PBMS Database Hostname
  type: string
  label: PBMS Database Hostname
  show_if: "openg2p-g2p-bridge-celery-workers.enabled=true"

- variable: global.registryDBHostname
  description: Registry Database Hostname
  type: string
  label: Registry Database Hostname
  show_if: "openg2p-g2p-bridge-celery-workers.enabled=true"

# Keymanager
- variable: keymanager.enabled
  description: This installs Keymanager for managing Keys for Encrpytion and Signatures
  type: boolean
  label: Install Keymanager?
  group: Keymanager Settings

- variable: global.g2pBridgeKeymanagerAuthEnabled
  label: API Authentication Enabled
  description: Enables Keymanager API Authentication.
  type: boolean
  group: Keymanager Settings
  show_if: "keymanager.enabled=true"

- variable: global.g2pBridgeKeymanagerAppId
  description: Keymanager Application ID for G2P Bridge
  type: string
  label: Keymanager App ID
  group: Keymanager Settings
  show_if: "keymanager.enabled=true"

- variable: keymanager.istio.enabled
  label: Expose Keymanager APIs
  description: >-
    Enable this to manually download/upload certificates to Keymanager.
    This exposes Keymanager APIs publicly outside Kubernetes.
  type: boolean
  group: Keymanager Settings
  show_if: "keymanager.enabled=true"

- variable: keymanager.springConfig.profile
  type: string
  label: Spring Config Profile
  group: Keymanager Settings
  show_if: "keymanager.enabled=true"

- variable: keymanager.springConfig.names
  type: string
  label: Spring Config Names
  group: Keymanager Settings
  show_if: "keymanager.enabled=true"

- variable: keymanager.springConfig.gitRepo.enabled
  description: Enables download of configs from Git repo.
  type: boolean
  label: Spring Config Git Enabled
  group: Keymanager Settings
  show_if: "keymanager.enabled=true"
  show_subquestion_if: true
  subquestions:
  - variable: keymanager.springConfig.gitRepo.repoUrl
    description: |-
      Repo Url for remote Git repo containing configs.
      This url should include username password if required.
    type: string
    label: Spring Config Git Repo Url
    group: Keymanager Settings

  - variable: keymanager.springConfig.gitRepo.branch
    description: Branch of remote Git repo containing configs.
    type: string
    label: Spring Config Git Repo Branch
    group: Keymanager Settings

- variable: keymanager.springConfig.rawConfig
  description: |-
    If git-based config is disabled, the complete application.properties can be
    directly supplied here.
  type: multiline
  label: Spring Config application properties.
  group: Keymanager Settings
  show_if: "keymanager.enabled=true&&keymanager.springConfig.gitRepo.enabled=false"

- variable: keymanager.envVars.auth_server_admin_allowed_audience
  description: |-
    List of Keycloak Client ID allowed to call this keymanager's APIs.
    Do not edit this parameter unless required.
  type: string
  label: Allowed Keycloak Client IDs.
  group: Keymanager Settings
  show_if: "keymanager.enabled=true&&global.g2pBridgeKeymanagerAuthEnabled=true"

- variable: keymanager.keystoreType
  label: Keystore Type
  description: PKCS11 for HSM. PKCS12 for storing into local p12 file.
  type: enum
  options:
    - PKCS11
    - PKCS12
  group: Keymanager Settings
  show_if: "keymanager.enabled=true"

- variable: keymanager.persistence.enabled
  label: Persistence Enabled
  description: Enable this if Keystore Type is PKCS12.
  type: boolean
  group: Keymanager Settings
  show_if: "keymanager.enabled=true"

- variable: artifactory.enabled
  label: Install Artifactory?
  description: >-
    This is mandatory if Keymanger API Auth is enabled. Or if
    Keymanager Keystore type is PKCS11.
  type: boolean
  group: Keymanager Settings
  show_if: "keymanager.enabled=true"

- variable: softhsm.enabled
  label: Install Softhsm?
  description: Enable this if Keystore Type is PKCS11.
  type: boolean
  group: Keymanager Settings
  show_if: "keymanager.enabled=true"
