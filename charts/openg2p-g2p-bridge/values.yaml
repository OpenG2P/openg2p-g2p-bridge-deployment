global:
  g2pBridgeHostname: g2p-bridge.zmb.openg2p.org

  g2pBridgeExampleBankBaseUrl: http://openg2p-g2p-bridge-example-bank-api

  keycloakBaseUrl: https://keycloak.openg2p.org
  keycloakIssuerUrl: '{{ tpl .Values.global.keycloakBaseUrl $ }}/realms/master'

  g2pBridgeMapperBaseUrl: 'http://spar-spar-mapper-api/sync'

  g2pBridgeAuthClientId: 'openg2p-g2p-bridge-{{ .Release.Namespace }}'
  g2pBridgeAuthClientSecret: ''

  g2pBridgeKeymanagerAuthEnabled: false
  g2pBridgeKeymanagerAppId: G2PBRIDGE

  PBMSDBHostname: 'pbms-gen2-odoo-postgresql'
  registryDBHostname: 'registry-postgresql'

openg2p-g2p-bridge-api:
  enabled: true
  nameOverride: api
  hostname: '{{ tpl .Values.global.g2pBridgeHostname $ }}'
  keymanagerInstallationName: '{{ .Release.Name }}-keymanager'

  replicaCount: 1
  updateStrategy:
    type: RollingUpdate
  serviceAccount:
    create: false
    name: ""
  image:
    repository: openg2p/openg2p-g2p-bridge-api
    tag: "2.0.0"
    pullPolicy: Always
  podSecurityContext:
    enabled: false
    fsGroup: 1001
  containerSecurityContext:
    enabled: false
    runAsUser: 1001
    runAsNonRoot: true
  
  openapiRootPath: /api/g2p-bridge
  
  service:
    type: ClusterIP
    port: 80
    externalTrafficPolicy: Cluster

  istio:
    enabled: true
    virtualservice:
      enabled: true
      gateway: "internal"
      destination: '{{ template "common.names.fullname" . }}'
      destinationPort: '{{ .Values.service.port }}'
      prefix: '{{ tpl .Values.openapiRootPath $ }}/'
      rewriteUri: "/"
  
  envVars:
    G2P_BRIDGE_DB_DBNAME: openg2p_g2p_bridge_db
    G2P_BRIDGE_DB_HOSTNAME: '{{ tpl .Values.postgresqlInstallationName $ }}'
    G2P_BRIDGE_DB_PORT: 5432
    G2P_BRIDGE_DB_USERNAME: bridgeuser
    G2P_BRIDGE_PORT: '{{ .Values.containerPort }}'
    G2P_BRIDGE_OPENAPI_ROOT_PATH: '{{ tpl .Values.openapiRootPath $ }}'
    
    G2P_BRIDGE_JWT_VALIDATE_KEYMANAGER_APP_ID: '{{ tpl .Values.global.g2pBridgeKeymanagerAppId $ }}'
    G2P_BRIDGE_KEYMANAGER_API_BASE_URL: "http://{{ tpl .Values.keymanagerInstallationName $ }}/v1/keymanager"
    G2P_BRIDGE_OAUTH_ENABLED: '{{ .Values.global.g2pBridgeKeymanagerAuthEnabled }}'
    G2P_BRIDGE_OAUTH_URL: "{{ tpl .Values.global.keycloakIssuerUrl $ }}/protocol/openid-connect/token"
    G2P_BRIDGE_OAUTH_CLIENT_ID: '{{ tpl .Values.global.g2pBridgeAuthClientId $ }}'
    G2P_BRIDGE_OAUTH_CLIENT_SECRET: '{{ tpl .Values.global.g2pBridgeAuthClientSecret $ }}'

  envVarsFrom:
    G2P_BRIDGE_DB_PASSWORD:
      secretKeyRef:
        name: '{{ tpl .Values.postgresqlInstallationName $ }}'
        key: password

  startupProbe:
    enabled: true
    httpGet:
      path: /ping
      port: http
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 30
    successThreshold: 1
  livenessProbe:
    enabled: true
    httpGet:
      path: /ping
      port: http
    initialDelaySeconds: 20
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 6
    successThreshold: 1
  readinessProbe:
    enabled: true
    httpGet:
      path: /ping
      port: http
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
    successThreshold: 1
  
  postgresCheckerInit:
    enabled: true
    image:
      repository: jbergknoff/postgresql-client
      tag: latest
      pullPolicy: IfNotPresent
    command:
    - 'sh'
    args:
    - '-c'
    - 'until pg_isready -U ${G2P_BRIDGE_DB_USERNAME} -h ${G2P_BRIDGE_DB_HOSTNAME} -p ${G2P_BRIDGE_DB_PORT:-5432} -d ${G2P_BRIDGE_DB_DBNAME:-bridgedb}; do sleep 3; done'
    containerSecurityContext:
      enabled: false

  postgresqlInstallationName: '{{ .Release.Name }}-postgresql'
  containerPort: 8000

openg2p-g2p-bridge-bene-portal-api:
