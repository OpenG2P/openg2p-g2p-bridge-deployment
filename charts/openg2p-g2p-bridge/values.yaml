global:
  g2pBridgeHostname: g2p-bridge.zmb.openg2p.org

  g2pBridgeExampleBankBaseUrl: http://openg2p-g2p-bridge-example-bank-api

  keycloakBaseUrl: https://keycloak.openg2p.org
  keycloakIssuerUrl: '{{ tpl .Values.global.keycloakBaseUrl $ }}/realms/master'

  g2pBridgeMapperBaseUrl: 'http://spar-spar-mapper-api/sync'

  g2pBridgeAuthClientId: 'openg2p-g2p-bridge-{{ .Release.Namespace }}'
  g2pBridgeAuthClientSecret: ''

  g2pBridgeKeymanagerAuthEnabled: false
  g2pBridgeKeymanagerAppId: G2PBRIDGE

  PBMSDBHostname: 'pbms-gen2-odoo-postgresql'
  registryDBHostname: 'registry-postgresql'


openg2p-g2p-bridge-api:
  enabled: true
  nameOverride: api
  hostname: '{{ tpl .Values.global.g2pBridgeHostname $ }}'

  keymanagerInstallationName: '{{ .Release.Name }}-keymanager'

  envVars:
    G2P_BRIDGE_JWT_VALIDATE_KEYMANAGER_APP_ID: '{{ tpl .Values.global.g2pBridgeKeymanagerAppId $ }}'

    G2P_BRIDGE_KEYMANAGER_API_BASE_URL: "http://{{ tpl .Values.keymanagerInstallationName $ }}/v1/keymanager"
    G2P_BRIDGE_OAUTH_ENABLED: '{{ .Values.global.g2pBridgeKeymanagerAuthEnabled }}'
    G2P_BRIDGE_OAUTH_URL: "{{ tpl .Values.global.keycloakIssuerUrl $ }}/protocol/openid-connect/token"
    G2P_BRIDGE_OAUTH_CLIENT_ID: '{{ tpl .Values.global.g2pBridgeAuthClientId $ }}'
    G2P_BRIDGE_OAUTH_CLIENT_SECRET: '{{ tpl .Values.global.g2pBridgeAuthClientSecret $ }}'

openg2p-g2p-bridge-bene-portal-api:
  enabled: true
  nameOverride: bene-portal-api

openg2p-g2p-bridge-celery-beat-producers:
  enabled: true
  nameOverride: celery-beat-producer
  envVars:
    G2P_BRIDGE_CELERY_BEAT_MAPPER_RESOLVE_FREQUENCY: 30
    G2P_BRIDGE_CELERY_BEAT_FUNDS_AVAILABLE_CHECK_FREQUENCY: 30
    G2P_BRIDGE_CELERY_BEAT_FUNDS_BLOCKED_FREQUENCY: 30
    G2P_BRIDGE_CELERY_BEAT_FUNDS_DISBURSEMENT_FREQUENCY: 30
    G2P_BRIDGE_CELERY_BEAT_MT940_PROCESSOR_FREQUENCY: 30
    G2P_BRIDGE_CELERY_BEAT_GEO_RESOLUTION_FREQUENCY: 30
    G2P_BRIDGE_CELERY_BEAT_WAREHOUSE_ALLOCATION_FREQUENCY: 30
    G2P_BRIDGE_CELERY_BEAT_AGENCY_ALLOCATION_FREQUENCY: 30
    G2P_BRIDGE_CELERY_BEAT_WAREHOUSE_NOTIFICATION_FREQUENCY: 30
    G2P_BRIDGE_CELERY_BEAT_AGENCY_NOTIFICATION_FREQUENCY: 30
    G2P_BRIDGE_CELERY_BEAT_BENEFICIARY_NOTIFICATION_FREQUENCY: 30

    G2P_BRIDGE_CELERY_BEAT_NO_OF_TASKS_TO_PROCESS: 2
    G2P_BRIDGE_CELERY_BEAT_DISBURSEMENT_RETRY_THRESHOLD_MINUTES: 30
    G2P_BRIDGE_CELERY_BEAT_PROCESS_FUTURE_DISBURSEMENT_SCHEDULES: true
    G2P_BRIDGE_CELERY_BEAT_TASK_STALE_THRESHOLD_MINUTES: 30

openg2p-g2p-bridge-celery-workers:
  enabled: true
  nameOverride: celery-worker

  keymanagerInstallationName: '{{ .Release.Name }}-keymanager'

  envVars:
    G2PCONNECT_MAPPER_CLIENT_API_BASE_URL: '{{ tpl .Values.global.g2pBridgeMapperBaseUrl $ }}'
    G2P_BRIDGE_CELERY_WORKERS_MAPPER_REQUEST_SENDER_ID: openg2p-g2p-bridge

    G2P_BRIDGE_CELERY_WORKERS_KEYMANAGER_API_BASE_URL: 'http://{{ tpl .Values.keymanagerInstallationName $ }}/v1/keymanager'
    G2P_BRIDGE_CELERY_WORKERS_KEYMANAGER_SIGN_APP_ID: '{{ tpl .Values.global.g2pBridgeKeymanagerAppId $ }}'
    G2P_BRIDGE_CELERY_WORKERS_OAUTH_ENABLED: '{{ .Values.global.g2pBridgeKeymanagerAuthEnabled }}'
    G2P_BRIDGE_CELERY_WORKERS_OAUTH_URL: '{{ tpl .Values.global.keycloakIssuerUrl $ }}/protocol/openid-connect/token'
    G2P_BRIDGE_CELERY_WORKERS_OAUTH_CLIENT_ID: '{{ tpl .Values.global.g2pBridgeAuthClientId $ }}'
    G2P_BRIDGE_CELERY_WORKERS_OAUTH_CLIENT_SECRET: '{{ tpl .Values.global.g2pBridgeAuthClientSecret $ }}'
    
    G2P_BRIDGE_CELERY_WORKERS_DB_DBNAME_PBMS: pbmsdb
    G2P_BRIDGE_CELERY_WORKERS_DB_HOSTNAME_PBMS: "{{ tpl .Values.global.PBMSDBHostname $ }}"
    G2P_BRIDGE_CELERY_WORKERS_DB_PORT_PBMS: 5432
    G2P_BRIDGE_CELERY_WORKERS_DB_USERNAME_PBMS: postgres

    # Mapper Client API
    G2PCONNECT_MAPPER_LINK_CLIENT_API_SIGN_ENABLED: false
    G2PCONNECT_MAPPER_UPDATE_CLIENT_API_SIGN_ENABLED: false
    G2PCONNECT_MAPPER_RESOLVE_CLIENT_API_SIGN_ENABLED: false
    G2PCONNECT_MAPPER_UNLINK_CLIENT_API_SIGN_ENABLED: false

    # Bank Connectors
    G2P_BRIDGE_CELERY_WORKERS_FUNDS_AVAILABLE_CHECK_URL_EXAMPLE_BANK: '{{ tpl .Values.global.g2pBridgeExampleBankBaseUrl $ }}/check_funds'
    G2P_BRIDGE_CELERY_WORKERS_FUNDS_BLOCK_URL_EXAMPLE_BANK: '{{ tpl .Values.global.g2pBridgeExampleBankBaseUrl $ }}/block_funds'
    G2P_BRIDGE_CELERY_WORKERS_FUNDS_DISBURSEMENT_URL_EXAMPLE_BANK: '{{ tpl .Values.global.g2pBridgeExampleBankBaseUrl $ }}/initiate_payment'
    G2P_BRIDGE_CELERY_WORKERS_BANK_SIMULATOR_CODE: EXAMPLE

    # Agency Allocator
    G2P_BRIDGE_AGENCY_ALLOCATOR_DB_USERNAME_PBMS: "postgres"
    G2P_BRIDGE_AGENCY_ALLOCATOR_DB_HOSTNAME_PBMS: "{{ tpl .Values.global.PBMSDBHostname $ }}"
    G2P_BRIDGE_AGENCY_ALLOCATOR_DB_PORT_PBMS: 5432
    G2P_BRIDGE_AGENCY_ALLOCATOR_DB_DBNAME_PBMS: "pbmsdb"

    # Warehouse Allocator
    G2P_BRIDGE_WAREHOUSE_ALLOCATOR_DB_USERNAME_PBMS: "postgres"
    G2P_BRIDGE_WAREHOUSE_ALLOCATOR_DB_HOSTNAME_PBMS: "{{ tpl .Values.global.PBMSDBHostname $ }}"
    G2P_BRIDGE_WAREHOUSE_ALLOCATOR_DB_PORT_PBMS: 5432
    G2P_BRIDGE_WAREHOUSE_ALLOCATOR_DB_DBNAME_PBMS: "pbmsdb"
  
    # Geo Resolver
    G2P_BRIDGE_GEO_RESOLVER_DB_USERNAME_REGISTRY: "postgres"
    G2P_BRIDGE_GEO_RESOLVER_DB_HOSTNAME_REGISTRY: "{{ tpl .Values.global.registryDBHostname $ }}"
    G2P_BRIDGE_GEO_RESOLVER_DB_PORT_REGISTRY: 5432
    G2P_BRIDGE_GEO_RESOLVER_DB_DBNAME_REGISTRY: "srdb"

    # Mapper Connectors
    G2P_BRIDGE_MAPPER_CONNECTORS_DB_USERNAME_REGISTRY: "postgres"
    G2P_BRIDGE_MAPPER_CONNECTORS_DB_HOSTNAME_REGISTRY: "{{ tpl .Values.global.registryDBHostname $ }}"
    G2P_BRIDGE_MAPPER_CONNECTORS_DB_PORT_REGISTRY: 5432
    G2P_BRIDGE_MAPPER_CONNECTORS_DB_DBNAME_REGISTRY: "srdb"
    
    # Notifications
    G2P_BRIDGE_CELERY_WORKERS_SUPPRESS_NOTIFICATIONS: true
    
  envVarsFrom:
    G2P_BRIDGE_CELERY_WORKERS_DB_PASSWORD_PBMS:
      secretKeyRef:
        name: '{{ tpl .Values.global.PBMSDBHostname $ }}'
        key: postgres-password
    G2P_BRIDGE_WAREHOUSE_ALLOCATOR_DB_PASSWORD_PBMS:
      secretKeyRef:
        name: '{{ tpl .Values.global.PBMSDBHostname $ }}'
        key: postgres-password
    G2P_BRIDGE_GEO_RESOLVER_DB_PASSWORD_REGISTRY:
      secretKeyRef:
        name: '{{ tpl .Values.global.registryDBHostname $ }}'
        key: postgres-password
    G2P_BRIDGE_MAPPER_CONNECTORS_DB_PASSWORD_REGISTRY:
      secretKeyRef:
        name: '{{ tpl .Values.global.registryDBHostname $ }}'
        key: postgres-password
    G2P_BRIDGE_AGENCY_ALLOCATOR_DB_PASSWORD_PBMS:
      secretKeyRef:
        name: '{{ tpl .Values.global.registryDBHostname $ }}'
        key: postgres-password

postgresql:
  enabled: true
  auth:
    username: bridgeuser
    database: openg2p_g2p_bridge_db
  additionalDbs:
    enabled: true
    userPasswordsExistingSecret: ""
    userPasswords:
      keymgruser: ""
  primary:
    resourcesPreset: "small"
    extendedConfiguration: |-
      wal_level = logical
      max_wal_senders = 20
      max_replication_slots = 10

redis:
  enabled: true
  architecture: standalone
  master:
    persistence:
      enabled: false
  auth:
    enabled: false

artifactory:
  enabled: false
  image:
    repository: mosipid/artifactory-server
    tag: 1.4.1-ES
  resources: {}

softhsm:
  enabled: false
  # Hardcoding this for now. else every upgrade will reset the pin
  securityPIN: MTg5MTAwMTc=
  resources: {}

keymanager:
  enabled: true
  hostname: '{{ tpl .Values.global.g2pBridgeHostname $ }}'
  authEnabled: '{{ .Values.global.keymanagerAuthEnabled }}'
  istio:
    enabled: false
  keystoreType: PKCS12
  springConfig:
    names: application,kernel
    profile: default
    gitRepo:
      enabled: true
      repoUrl: https://github.com/openg2p/mosip-config
      branch: master
    rawConfig: ""
  envVars:
    auth_server_admin_allowed_audience: 'openg2p-g2p-bridge,openg2p-g2p-bridge-{{ .Release.Namespace }}'
  envVarsFrom:
    db_dbuser_password:
      secretKeyRef:
        name: '{{ .Release.Name }}-postgresql-addl-user-passwords'
        key: keymgruser
  postgresInit:
    envVarsFrom:
      DBUSER_PWD:
        secretKeyRef:
          name: '{{ .Release.Name }}-postgresql-addl-user-passwords'
          key: keymgruser
  keygen:
    appIdsList:
      - '{{ tpl .Values.global.g2pBridgeKeymanagerAppId $ }}'
    baseKeysList:
      - '{{ tpl .Values.global.g2pBridgeKeymanagerAppId $ }}:ENCRYPT'
  persistence:
    enabled: true
